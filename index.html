<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Task Manager</h1>
      <p class="subtitle">Manage your tasks efficiently</p>
    </header>

    <div class="task-input-wrapper">
      <input 
        id="taskInput" 
        type="text" 
        placeholder="Enter a new task..."
        class="task-input"
      />
      <textarea
        id="descriptionInput"
        placeholder="Add description (optional)..."
        class="description-input"
        rows="2"
      ></textarea>
      <input 
        id="deadlineInput" 
        type="datetime-local" 
        class="deadline-input"
        title="Optional deadline"
      />
      <button id="addBtn" class="add-btn">Add Task</button>
    </div>

    <div id="stats" class="stats"></div>

    <div class="task-list-wrapper">
      <ul id="taskList" class="task-list"></ul>
      <p id="emptyState" class="empty-state">No tasks yet. Add one to get started!</p>
    </div>

    <button id="clearCompletedBtn" class="clear-btn">Clear Completed</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
